specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Block Lottos
providerId: blocklottos-com
created: '2026-09-19'
modified: '2026-09-19'
generated: '2026-09-19'
method: searched
source: 'https://blocklottos.com/api-docs#lottery-rate-limits and #ads-rate-limits (per-endpoint tables, 2026-09-19);
  response-header behaviour from the same page ("When rate limited, the response includes a retry_after field (in
  seconds) and an HTTP Retry-After header"); live 200 responses probed 2026-09-19 carried no quota headers.'
sources:
- https://blocklottos.com/api-docs#lottery-rate-limits
- https://blocklottos.com/api-docs#ads-rate-limits
tags:
- Rate Limiting
- Lottery
- Advertising
description: 'Every endpoint is rate limited per client IP on a one-minute window: 2/min on cached read endpoints,
  5/min on affiliate enrollment, 10/min on transaction builders, quote and confirm endpoints. Exhaustion returns
  HTTP 429 with a Retry-After header and a retry_after body field. No quota-remaining headers are emitted on successful
  responses; read endpoints are served from a 60-second cache, so polling faster than once a minute is pointless
  as well as throttled.'
limit_count: 17
headers:
  retryAfter: Retry-After
  limit: null
  remaining: null
  reset: null
  requestId: null
  observed: 200 responses on 2026-09-19 carried Cache-Control (public, max-age=60 on reads; no-cache on wallet reads;
    no-store on writes) and CORS headers only - no X-RateLimit-*/RateLimit-* headers.
responseCodes:
  throttled: 429
bodyFields:
  retry_after: seconds until the window resets (429 body)
