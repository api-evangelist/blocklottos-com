policies:
- name: Per-IP scope
  description: All limits are keyed on the client IP; there are no per-key or per-account tiers because there are
    no keys or accounts.
- name: 60-second read cache
  description: 'Jackpot, stats and draw-history responses are cached 60 seconds server-side (Cache-Control: public,
    max-age=60).'
- name: Back-off
  description: On 429 wait for Retry-After seconds. Never re-broadcast a wallet transaction because a confirm/pay
    call was throttled - retry the confirmation instead.
