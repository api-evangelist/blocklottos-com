- id: lottery-tickets
  name: Lottery tickets
  type: usage-based
  description: One ticket = six unique numbers 1-49 for the next weekly draw. 80% of each ticket funds the jackpot,
    20% operations (hardcoded in the contract per the FAQ). Minimum verified-winner payout 100 USDC (Base) / 100
    POL (Polygon), higher live jackpot applies. Purchases are final.
  entries:
  - label: Base Future Ledger ticket
    name: ticket_base
    type: metered
    metric: ticket
    limit: -1
    timeFrame: usage
    unit: 1
    price: 1 USDC (+ Base ETH gas)
    geo: Base Mainnet 8453
