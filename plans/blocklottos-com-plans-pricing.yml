description: 'The API itself has no paid tier: every endpoint is free, key-less and per-IP rate limited. Money enters
  in three places, each priced on chain in stablecoin or native token: lottery tickets (1 USDC on Base, 10 POL on
  Polygon), banner advertising (a flat 1 USDC submit fee plus 85/140/250 USDC for 7/14/30 days, identical across
  all four sizes as of 2026-09-19), and an affiliate programme paying 5% of referred ticket price. Prices are read
  live from /api/ads/sizes and /api/lottery/agent-capabilities; the docs tell callers never to hard-code them.'
