status_codes:
- status: 202
  meaning: Transaction still pending - poll confirm-ticket-tx again (confirmBaseTicketPurchase)
  retry: true
- status: 400
  meaning: 'Bad request: missing or invalid parameters; "Invalid or unsafe request" on agent endpoints. Documented
    validation messages for build-ticket-tx: "Must provide exactly 6 numbers", "Numbers must be between 1 and 49",
    "Numbers must be unique", "Invalid wallet address"'
  retry: false
- status: 402
  meaning: 'Payment required: the USDC payment for a quote was not verified on chain (confirmAdSubmitPayment, confirmAdActivationPayment)'
  retry: retry the confirmation after more confirmations; never re-send the payment
- status: 404
  meaning: 'Not found: unknown submission_id (getAdStatus, activation) or no public draw proof yet (getLotteryDrawProof)'
  retry: false
- status: 405
  meaning: 'Method not allowed: wrong HTTP method (e.g. GET on the POST-only agent endpoints; declared on the jackpot/stats
    reads)'
  retry: false
- status: 409
  meaning: 'Conflict: ad not in the right state for activation; price cap exceeded or intent expired (prepareBaseAgentPurchase);
    failed or mismatched transaction (confirmBaseTicketPurchase)'
  retry: only after re-reading live state; a 409 on purchase preparation is a stop signal
- status: 429
  meaning: Rate limited per IP; Retry-After header and retry_after body field give the wait in seconds
  retry: after Retry-After
- status: 500
  meaning: Server error (documented on the Advertising API)
  retry: with backoff
- status: 503
  meaning: 'Upstream unavailable: chain RPC (lottery reads, agent purchase/confirm) or the affiliate service (agent-referral)'
  retry: with backoff; never re-broadcast a transaction because a confirm returned 503
