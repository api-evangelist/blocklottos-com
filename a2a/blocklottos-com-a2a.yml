  grade_basis: 'Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass: streaming, pushNotifications,
    stateTransitionHistory declared as fields). skills is an ARRAY (pass, six entries with id/name/description/tags).
    protocolVersion is ABSENT (fail) - nowhere at the top level and there is no supportedInterfaces[]/additionalInterfaces[]
    block that could carry it, so the card declares no A2A protocol version at all. One hard-check failure makes
    the card "flavored" even though it carries both optional mode fields. The document reads as a hybrid: it uses
    the A2A vocabulary (capabilities, skills, defaultInputModes, provider) but opens with schema_version "v1" and
    a slug, and most of its bulk is provider-defined discovery (entrypoints, api_capabilities, chains, trust, protocols,
    agent_instructions, live_draw_data, winner_payout_policy).'
