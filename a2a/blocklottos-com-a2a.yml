  - field: version
    observed: '"2026.09.09"'
    note: Date-shaped rather than semver; harmless, recorded for readers that parse it.
  - field: securitySchemes / security
    observed: absent
    note: Reads are key-less and writes are wallet-signature gated, which the card states in prose (trust.*) rather
      than in a security scheme.
surface_relationship:
  note: 'The card is a discovery hub, not an A2A endpoint. It fans out to: the OpenAPI at /openapi.json (20 operations,
    see openapi/), the stdio MCP server (uvx --from git+https://blocklottos.com/git/blocklottos-agent-tools.git
    blocklottos-mcp, see mcp/), the provider-authored SKILL.md (see skills/), llms.txt + agents.txt (see llms/),
    and the provider-defined agent-actions.json / affiliate-program.json manifests (see well-known/). An agent that
    can only speak A2A cannot invoke anything here; an agent that can call REST or run a local MCP package can do
    everything the card describes.'
