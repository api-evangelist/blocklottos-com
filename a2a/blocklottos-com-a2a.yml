    observed: absent
    note: No A2A protocol version declared anywhere in the card.
  - field: url
    observed: https://blocklottos.com (the homepage)
    note: A2A expects url to be the agent's A2A endpoint (JSON-RPC/gRPC/HTTP+JSON). This card's url is the website;
