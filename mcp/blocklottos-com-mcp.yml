summary: 'Block Lottos ships ONE MCP server, "Block Lottos" (blocklottos_mcp, MIT), as a local stdio Python package
  - on PyPI as blocklottos-mcp (1.0.2, released 2026-09-10) and as a self-hosted public Git repository. It is listed
  in the official MCP registry as com.blocklottos/blocklottos (stdio, pypi). There is NO hosted/remote endpoint:
  the site has no /mcp route (404), no mcp.blocklottos.com host (NXDOMAIN) and no .well-known/mcp.json (404). The
  server wraps the public REST API (client.py, base https://blocklottos.com) with 10 tools and 2 resources, is Base-only
  for writes, requires no credentials, and hard-fails if a prepared transaction does not match the published Base
  contract/USDC/1-ticket shape.'
