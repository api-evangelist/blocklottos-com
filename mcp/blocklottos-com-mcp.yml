- name: prepare_ticket_purchase
  category: financial_preparation
  description: Prepare exactly one unsigned 1-USDC Base ticket purchase. It never signs or broadcasts. Obtain owner
    approval or apply a narrow owner policy before submitting returned wallet transactions.
  annotations:
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: true
  inputSchema:
    type: object
    properties:
      wallet_address:
        type: string
        pattern: ^0x[0-9a-fA-F]{40}$
      numbers:
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 49
        minItems: 6
        maxItems: 6
        uniqueItems: true
      idempotency_key:
        type: string
        pattern: ^[A-Za-z0-9._:-]{8,128}$
      max_price_usdc:
