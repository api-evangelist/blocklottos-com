safety_model:
- 'Server-side (in the MCP client code): every prepared purchase is re-validated locally - chain 8453, contract
  0xe5a9cF597ec65523BD71a8433B620eB1F3Eb0d0a, USDC 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913, exactly 1,000,000
  units, approve() selector 0x095ea7b3 scoped to one ticket, buyTicket calldata decoded back to the requested numbers
  - and rejected with "failed local safety validation" on any mismatch.'
- max_price_usdc is pinned to exactly 1 USDC by the MCP even though the REST endpoint accepts other caps.
- 'Financial tools carry destructiveHint: true / idempotentHint: false; reads carry readOnlyHint: true.'
- The package never handles private keys; signing and broadcasting happen in the caller's wallet.
crosswalk: mcp/blocklottos-com-tool-crosswalk.yml
