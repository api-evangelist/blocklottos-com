openapi: 3.2.0
info:
  title: Blocklottos Com Lottery API
  version: 1.2.0
  contact:
    name: Block Lottos Support
    email: support@blocklottos.com
    url: https://blocklottos.com/contact
  license:
    name: Public
    url: https://blocklottos.com/terms
  description: 'Operations tagged Lottery across 2 of this provider''s published API definitions: blocklottos-com-openapi.json, blocklottos-com-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://blocklottos.com
  description: Production
security: []
tags:
- name: Lottery
  description: Lottery data and transaction builders for Polygon Fortune Ledger and Base Future Ledger
paths:
  /api/jackpot.php:
    get:
      operationId: getJackpot
      summary: Get current jackpot
      description: Returns the selected game’s live on-chain jackpot, its published minimum winner payout, and the payable winner amount, which is the higher of those values. Supports ?chain=polygon or ?chain=base.
      tags:
      - Lottery
      responses:
        '200':
          description: Current jackpot amount
          content:
            application/json:
              schema:
                type: object
                properties:
                  jackpot_pol:
                    type: number
                    description: Polygon-only jackpot amount in POL. Present when chain=polygon.
                    example: 142.5
                  jackpot_wei:
                    type: string
                    description: Jackpot amount in wei (string to preserve precision)
                    example: '142500000000000000000'
                  contract:
                    type: string
                    description: Smart contract address
                    example: '0x07F62Ff6697eD9b475FEed9dc90a5A157936839c'
                  status:
                    type: string
                    enum:
                    - ok
                    - error
                  jackpot_usdc:
                    type: number
                    description: Base-only jackpot amount in USDC. Present when chain=base.
                    example: 142.5
                  onchain_jackpot:
                    type: number
                    description: Amount currently reported by the selected lottery smart contract.
                  minimum_winner_payout:
                    type: number
                    description: Published minimum paid for a valid winning ticket. Currently 100 in the selected game currency.
                    example: 100
                  winner_payout:
                    type: number
                    description: 'Payable amount for a valid winning ticket: the higher of onchain_jackpot and minimum_winner_payout.'
                    example: 100
                  higher_live_jackpot_applies:
                    type: boolean
                    description: True when a live jackpot above the minimum becomes the payable winner amount.
                    example: true
                  minimum_winner_payout_pol:
                    type: number
                    description: Polygon minimum winner payout in POL.
                    example: 100
                  winner_payout_pol:
                    type: number
                    description: Polygon payable winner amount in POL.
                    example: 100
                  minimum_winner_payout_usdc:
                    type: number
                    description: Base minimum winner payout in USDC.
                    example: 100
                  winner_payout_usdc:
                    type: number
                    description: Base payable winner amount in USDC.
                    example: 100
        '400':
          description: Invalid input or unsupported chain. Use polygon or base.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unsupported chain. Use polygon or base.
        '405':
          description: Method not allowed
      parameters:
      - name: chain
        in: query
        required: false
        schema:
          type: string
          enum:
          - polygon
          - base
          default: polygon
        description: Lottery chain to query. Use polygon for Polygon Fortune Ledger or base for Base Future Ledger.
    servers:
    - url: https://blocklottos.com
      description: Production
  /api/stats.php:
    get:
      operationId: getStats
      summary: Get site stats
      description: Returns the selected game’s live on-chain jackpot, its published minimum winner payout, and the payable winner amount, which is the higher of those values. Supports ?chain=polygon or ?chain=base.
      tags:
      - Lottery
      responses:
        '200':
          description: Site statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  draw_number:
                    type: integer
                    description: Upcoming draw number
                    example: 8
                  jackpot_pol:
                    type: number
                    description: Polygon-only jackpot amount in POL. Present when chain=polygon.
                    example: 142.5
                  next_draw_timestamp:
                    type: integer
                    description: Unix timestamp of next draw (Saturdays 15:00 UTC)
                    example: 1745589600
                  status:
                    type: string
                    enum:
                    - ok
                    - error
                  jackpot_usdc:
                    type: number
                    description: Base-only jackpot amount in USDC. Present when chain=base.
                    example: 142.5
                  onchain_jackpot:
                    type: number
                    description: Amount currently reported by the selected lottery smart contract.
                  minimum_winner_payout:
                    type: number
                    description: Published minimum paid for a valid winning ticket. Currently 100 in the selected game currency.
                    example: 100
                  winner_payout:
                    type: number
                    description: 'Payable amount for a valid winning ticket: the higher of onchain_jackpot and minimum_winner_payout.'
                    example: 100
                  higher_live_jackpot_applies:
                    type: boolean
                    description: True when a live jackpot above the minimum becomes the payable winner amount.
                    example: true
                  minimum_winner_payout_pol:
                    type: number
                    description: Polygon minimum winner payout in POL.
                    example: 100
                  winner_payout_pol:
                    type: number
                    description: Polygon payable winner amount in POL.
                    example: 100
                  minimum_winner_payout_usdc:
                    type: number
                    description: Base minimum winner payout in USDC.
                    example: 100
                  winner_payout_usdc:
                    type: number
                    description: Base payable winner amount in USDC.
                    example: 100
        '400':
          description: Invalid input or unsupported chain. Use polygon or base.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unsupported chain. Use polygon or base.
        '405':
          description: Method not allowed
      parameters:
      - name: chain
        in: query
        required: false
        schema:
          type: string
          enum:
          - polygon
          - base
          default: polygon
        description: Lottery chain to query. Use polygon for Polygon Fortune Ledger or base for Base Future Ledger.
    servers:
    - url: https://blocklottos.com
      description: Production
  /api/lottery/build-ticket-tx:
    post:
      operationId: buildLotteryTicketTx
      summary: Build an unsigned lottery ticket transaction
      description: Builds transaction data for buying a lottery ticket. Polygon returns a native POL value transaction. Base returns a USDC approval transaction plus a zero-value ticket purchase transaction.
      tags:
      - Lottery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - wallet_address
              - numbers
              properties:
                chain:
                  type: string
                  enum:
                  - polygon
                  - base
                  default: polygon
                wallet_address:
                  type: string
                  example: '0x000000000000000000000000000000000000dEaD'
                numbers:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                    maximum: 49
                  minItems: 6
                  maxItems: 6
                  example:
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5
                  - 6
                referral_id:
                  type: string
                  description: Optional Base referral ID as 0x bytes32 or a short code up to 32 characters.
                max_price_usdc:
                  type: string
                  description: Optional Base safety cap. Request fails closed if the live ticket price exceeds this USDC amount.
                  example: '1.00'
                idempotency_key:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Optional caller-generated correlation key. It makes preparation correlation deterministic but does not prevent duplicate wallet broadcasts; the wallet agent must submit each transaction at most once.
                valid_until:
                  type: string
                  format: date-time
                  description: Purchase-intent expiry checked during transaction preparation. Must include an explicit timezone and be no more than 7 days ahead. The contract transaction has no deadline parameter, so the wallet must recheck expiry before broadcasting.
                agent_id:
                  type: string
                  maxLength: 80
                  description: Optional privacy-safe agent label for internal attribution.
      responses:
        '200':
          description: Unsigned transaction payloads ready for wallet signing
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid input or unsupported chain. Use polygon or base.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unsupported chain. Use polygon or base.
        '503':
          description: RPC unavailable
    servers:
    - url: https://blocklottos.com
      description: Production
  /api/lottery/tickets/{wallet}:
    get:
      operationId: getLotteryTickets
      summary: Get wallet tickets for the active draw
      description: Returns tickets purchased by a wallet for the active draw on Polygon or Base.
      tags:
      - Lottery
      parameters:
      - name: wallet
        in: path
        required: true
        schema:
          type: string
      - name: chain
        in: query
        required: false
        schema:
          type: string
          enum:
          - polygon
          - base
          default: polygon
        description: Lottery chain to query. Use polygon for Polygon Fortune Ledger or base for Base Future Ledger.
      responses:
        '200':
          description: Wallet ticket list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid input or unsupported chain. Use polygon or base.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unsupported chain. Use polygon or base.
        '503':
