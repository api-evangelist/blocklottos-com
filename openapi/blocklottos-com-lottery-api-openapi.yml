    servers:
    - url: https://blocklottos.com
      description: Production
  /api/lottery/draw-history:
    get:
      operationId: getLotteryDrawHistory
      summary: Get lottery draw history
      description: Returns recent completed on-chain draw results from Polygon or Base. If no on-chain draw has completed yet, returns published public draw results from the website result JSON files.
      tags:
      - Lottery
      parameters:
      - name: chain
        in: query
        required: false
        schema:
          type: string
          enum:
          - polygon
          - base
          default: polygon
        description: Lottery chain to query. Use polygon for Polygon Fortune Ledger or base for Base Future Ledger.
      - name: draw_id
        in: query
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
      responses:
        '200':
          description: Live draw history for the selected chain. Call this endpoint for current data; do not rely on copied examples.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: RPC unavailable
        '400':
          description: Invalid input or unsupported chain. Use polygon or base.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unsupported chain. Use polygon or base.
      externalDocs:
        description: Public result JSON files
        url: https://blocklottos.com/data/draws/latest.json
    servers:
    - url: https://blocklottos.com
      description: Production
  /api/lottery/draw-proof:
    get:
      operationId: getLotteryDrawProof
      summary: Get public draw proof
      description: Returns the public cutoff commitment or completed draw proof for Polygon Fortune Ledger or Base Future Ledger. During cutoff, winning numbers and the secret seed are hidden. After draw runtime, the proof includes the revealed seed, chain anchor block, final seed, and winning numbers.
      tags:
      - Lottery
      parameters:
      - name: chain
        in: query
        required: false
        schema:
          type: string
          enum:
          - polygon
          - base
          default: polygon
        description: Lottery chain to query. Use polygon for Polygon Fortune Ledger or base for Base Future Ledger.
      - name: draw_id
        in: query
        required: false
        schema:
          type: integer
        description: Specific draw ID. Omit for the latest public proof.
      responses:
        '200':
          description: Public cutoff or completed draw proof
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: No public proof is available yet
        '400':
          description: Invalid input or unsupported chain. Use polygon or base.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unsupported chain. Use polygon or base.
      externalDocs:
        description: Human-readable proof page
        url: https://blocklottos.com/draw-proof
    servers:
    - url: https://blocklottos.com
      description: Production
  /api/lottery/check-prizes/{wallet}:
    get:
      operationId: checkLotteryPrizes
      summary: Check outstanding failed prize payout for a wallet
      description: Checks whether a wallet has an outstanding failed on-chain prize transfer that can be retried through retrySendPrize(). This endpoint covers contract transfer status only; use winner_payout fields from jackpot, stats, or agent capabilities for the game’s complete minimum and payable amount.
      tags:
      - Lottery
      parameters:
      - name: wallet
        in: path
        required: true
        schema:
          type: string
      - name: chain
        in: query
        required: false
        schema:
          type: string
          enum:
          - polygon
          - base
          default: polygon
        description: Lottery chain to query. Use polygon for Polygon Fortune Ledger or base for Base Future Ledger.
      responses:
        '200':
          description: Outstanding failed-prize payout status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid input or unsupported chain. Use polygon or base.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unsupported chain. Use polygon or base.
        '503':
          description: RPC unavailable
    servers:
    - url: https://blocklottos.com
      description: Production
