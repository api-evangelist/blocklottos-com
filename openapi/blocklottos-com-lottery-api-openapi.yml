                        type: object
                        properties:
                          currency:
                            type: string
                            example: USDC
                          minimum:
                            type: number
                            example: 100
                          higher_live_jackpot_applies:
                            type: boolean
                            example: true
                          summary:
                            type: string
                  workflow:
                    type: array
                    items:
                      type: object
                  safety:
                    type: array
                    items:
                      type: string
                additionalProperties: true
