aid: blocklottos-com
name: Block Lottos
description: Block Lottos is a blockchain lottery platform (Polygon Fortune Ledger, paid in POL, and Base Future
  Ledger, paid in USDC on Base) that publishes a public, key-free REST API for live jackpots, draw history, wallet
  tickets, prize status and commit-reveal draw proofs, an unsigned-transaction builder for tickets and banner-ad
  placements, and a Base-first agent purchase flow (capabilities, free referral enrollment, one-ticket preparation
  with a price cap and idempotency key, on-chain confirmation). It ships an OpenAPI 3.1 document, llms.txt and agents.txt,
  an ai-plugin manifest, an agent card at /.well-known/agent.json, a provider-authored SKILL.md and an open-source
  stdio MCP server on PyPI (blocklottos-mcp). The server never holds keys, signs or broadcasts; every purchase is
  non-custodial.
