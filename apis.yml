apis:
- aid: blocklottos-com:block-lottos-api
  name: Block Lottos API
  description: Public Block Lottos API (OpenAPI 3.1.0, v1.2.0, 20 operations, no API key) covering lottery reads
    for Polygon Fortune Ledger and Base Future Ledger (jackpot, stats, draw history, draw proof, wallet tickets,
    prize checks), unsigned ticket-transaction building, the Base-first agent flow (agent-capabilities, agent-referral,
    agent-purchase, confirm-ticket-tx) and a quote-first USDC banner advertising API (sizes, submit, submit/pay,
    status, wallet lookup, activate, activate/pay). All responses are JSON; rate limits are per IP with a Retry-After
    header on 429.
